<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <title th:text="|Cell to Singularity - ${gardenName}|"/>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <link rel="stylesheet" href="/css/celltosingularity.css">
</head>

<body>
<div class="container">
    <div class="itemStats">
        <h1 th:text="${gardenName}"/>
        <a th:href="${gardenGet}">Reset and get garden.</a>
        <h2>Generator Productions</h2>
        <table>
            <tr>
                <th>Generator</th>
                <th>Count</th>
                <th>Cost of Next</th>
                <th>Production of Each</th>
                <th th:if="${timedGenerators}">Total Production per Cycle</th>
                <th>Total Production</th>
                <th>Portion</th>
                <th>Increase</th>
            </tr>
            <tr th:each="generatorProduction : ${generatorProductions}">
                <td th:text="${generatorProduction.name}"/>
                <td>
                    <form action="#" th:action="@{${gardenGeneratorUpdate}}" method="post">
                        <input type="hidden" name="target" th:value="${generatorProduction.name}">
                        <input name="value" id="count" type="number" th:value="${generatorProduction.count}">
                        <input type="submit" value="Set">
                        <input type="submit" th:formaction="@{${gardenGeneratorIncrement}}" value="+1">
                        <input type="submit" th:formaction="@{${gardenGeneratorDecrement}}" value="-1">
                    </form>
                </td>
                <td class="alnright" th:text="${generatorProduction.next}"/>
                <td class="alnright" th:text="${generatorProduction.each}"/>
                <td class="alnright" th:if="${timedGenerators}" th:text="${generatorProduction.totalPerCycle}"/>
                <td class="alnright" th:text="${generatorProduction.total}"/>
                <td class="alnright" th:text="${generatorProduction.portion}"/>
                <td class="alnright" th:text="${generatorProduction.increase}"/>
            </tr>
        </table>
        <h2>Total Production</h2>
        <table>
            <tr th:each="totalProduction : ${totalProductions}">
                <td th:text="${totalProduction}"/>
            </tr>
        </table>
        <h2 th:if="${multiCurrency}">Generator Costs</h2>
        <table th:if="${multiCurrency}">
            <tr>
                <th>Generator</th>
                <th>Total Cost</th>
                <th>Ratio</th>
                <th>Next Cost</th>
            </tr>
            <tr th:each="generatorCost : ${generatorCosts}">
                <td>
                    <form action="#" th:action="@{${gardenGeneratorIncrement}}" method="post">
                        <input type="hidden" name="target" th:value="${generatorCost.label}">
                        <input type="submit" th:formaction="@{${gardenGeneratorIncrement}}"
                               th:value="${generatorCost.label}">
                    </form>
                </td>
                <td class="alnright" th:text="${generatorCost.cost}"/>
                <td class="alnright" th:text="${generatorCost.ratio}"/>
                <td class="alnright" th:text="${generatorCost.next}"/>
            </tr>
        </table>
        <h2>Generators</h2>
        <table>
            <tr th:each="generatorModel : ${generatorModels}">
                <td>
                    <form action="#" th:action="@{${gardenGeneratorUpdate}}" method="post">
                        <input type="hidden" name="target" th:value="${generatorModel.name}">
                        <label for="count" th:text="${generatorModel.name}"/>
                        <input name="value" id="count" type="number" th:value="${generatorModel.count}"
                               th:disabled="${!generatorModel.unlocked}">
                        <input type="submit" value="Set count" th:disabled="${!generatorModel.unlocked}">
                        <input type="submit" th:formaction="@{${gardenGeneratorIncrement}}" value="+1"
                               th:disabled="${!generatorModel.unlocked}">
                        <input type="submit" th:formaction="@{${gardenGeneratorDecrement}}" value="-1"
                               th:disabled="${!generatorModel.unlocked}">
                    </form>
                    <th:block th:each="upgradeModel : ${generatorModel.upgradeModels}">
                        <form action="#" th:action="@{${gardenUpgrade}}" method="post">
                            <input type="hidden" name="target" th:value="${upgradeModel.name}">
                            <input type="checkbox" id="upgrade" name="value" th:value="${upgradeModel.name}"
                                   th:checked="${upgradeModel.isBought}" th:disabled="${!upgradeModel.unlocked}"
                                   onchange="this.form.submit()">
                            <label for="upgrade" th:text="${upgradeModel.label}"/>
                        </form>
                    </th:block>
                </td>
            </tr>
        </table>
    </div>
    <div class="itemActions">
        <th:block th:each="mappingIncrementsModel : ${mappingIncrementsModels}">
            <h2 th:text="${mappingIncrementsModel.mapping}"/>
            <table>
                <tr>
                    <th>Name</th>
                    <th>Cost</th>
                    <th>Yield</th>
                    <th>Increase</th>
                    <th>Time</th>
                </tr>
                <tr th:each="incrementModel : ${mappingIncrementsModel.incrementModels}">
                    <td>
                        <form method="post">
                            <input type="hidden" name="target" th:value="${incrementModel.name}">
                            <label th:text="${incrementModel.type}"/>
                            <input type="submit" th:value="${incrementModel.name}"
                                   th:if="${incrementModel.type == '(G)'}"
                                   th:formaction="@{${gardenGeneratorIncrement}}">
                            <input type="hidden" name="value" th:value="${incrementModel.name}"
                                   th:unless="${incrementModel.type == '(G)'}">
                            <input type="submit" th:value="${incrementModel.name}"
                                   th:unless="${incrementModel.type == '(G)'}"
                                   th:formaction="@{${gardenUpgrade}}">
                        </form>
                    </td>
                    <td class="alnright" th:text="${incrementModel.cost}"/>
                    <td class="alnright" th:text="${incrementModel.yield}"/>
                    <td class="alnright" th:text="${incrementModel.increase}"/>
                    <td class="alnright" th:text="${incrementModel.time}"/>
                </tr>
            </table>
        </th:block>
        <h2>Actions</h2>
        <table>
            <tr th:each="action : ${actions}">
                <td th:text="${action}"/>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
